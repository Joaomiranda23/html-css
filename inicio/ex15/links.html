<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>links</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            background-color: cornsilk;
        }
        a{
            text-decoration: none;
            
        }
        a:hover{
            text-decoration:underline;

        }
         div > li{
            display:none;
        }
        div:hover > li{
            display:block;
            background-color: yellow;
            width:200px;
        
        }
        a::after{
            content: '<';
        }
        a::before{
            content:'>';
        }
    </style>
</head>
<body>
    <h1>Links personalizados</h1>
    <ul>
        <li class="especial"><a href="https://gustavoguanabara.github.io">Repósitorio do github</a></li>
        <li><a href="https://youtube.com/cursoemvideo/">Youtube</a></li>
        <div> Abaixo temos o link do curso em vídeo
            <li><a href="https://www.cursoemvideo.com">Site CursoEmVideo</a></li>
        </div>
    </ul>
</body>
</html>
